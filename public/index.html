<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luau VMP Deobfuscator Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #0d1117; color: #c9d1d9; padding: 15px; }
    h1 { color: #58a6ff; font-size: 1.4rem; margin-bottom: 12px; }
    .container { display: flex; gap: 15px; height: 78vh; }
    .editor-box { flex: 1; display: flex; flex-direction: column; }
    label { margin-bottom: 6px; color: #8b949e; font-size: 12px; font-weight: bold; }
    .editor { flex: 1; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
    button {
      margin-top: 15px;
      padding: 12px 24px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
</head>
<body>

  <h1>Luau VMP Deobfuscator Studio</h1>

  <div class="container">
    <div class="editor-box">
      <label>OBFUSCATED LUA SCRIPT</label>
      <div id="inputEditor" class="editor"></div>
    </div>
    <div class="editor-box">
      <label>DEOBFUSCATED OUTPUT</label>
      <div id="outputEditor" class="editor"></div>
    </div>
  </div>

  <button id="deobfBtn">Run Deobfuscator</button>

  <script>
    let inputEditor, outputEditor;

    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      inputEditor = monaco.editor.create(document.getElementById('inputEditor'), {
        value: '-- Paste obfuscated Luau script here',
        language: 'lua',
        theme: 'vs-dark',
        automaticLayout: true
      });

      outputEditor = monaco.editor.create(document.getElementById('outputEditor'), {
        value: '-- Cleaned output will appear here',
        language: 'lua',
        theme: 'vs-dark',
        readOnly: true,
        automaticLayout: true
      });
    });

    document.getElementById('deobfBtn').addEventListener('click', async () => {
      const rawCode = inputEditor.getValue();
      if (!rawCode.trim()) return;

      outputEditor.setValue('-- Running Luau VMP deobfuscation engine...');

      try {
        const response = await fetch('/api/deobfuscate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: rawCode })
        });

        const data = await response.json();
        if (data.success) {
          outputEditor.setValue(data.deobfuscated);
        } else {
          outputEditor.setValue('-- Error: ' + data.error);
        }
      } catch (err) {
        outputEditor.setValue('-- Network Error: ' + err.message);
      }
    });
  </script>
</body>
</html>
